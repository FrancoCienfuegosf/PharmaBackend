server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.driver.OracleDriver
  jpa:
    database: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate

    show-sql: false

    properties:
      hibernate:
        format_sql: false


springdoc:
  swagger-ui:
    enabled: false

  api-docs:
    enabled: false



# En produccion el secreto NUNCA se escribe en el repositorio:
# llega por variable de entorno (minimo 32 bytes en Base64).
jwt:
secret: ${JWT_SECRET}
expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:30}







