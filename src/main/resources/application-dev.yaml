server:
  port: 8080
spring:
  datasource:
    url: jdbc:oracle:thin:@//localhost:1522/xepdb1
    username: pharmaDB
    password: 1234567
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    show-sql: false   # el SQL se registra con logging.level.org.hibernate.SQL

    properties:
      hibernate:
        format_sql: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true

# JWT en desarrollo. El secreto es una clave Base64 de 48 bytes (384 bits).
# Es SOLO para clase: en produccion llega por variable de entorno.
app:
  jwt:
    secret: w9Z6dP/dzykNH/uiI3Z/KGjBlP0H4Ji+Tuq4fm2cTNuLD4jWafu1gBL74V2SJEvy
    expiracion-minutos: 60
  # Origenes permitidos: ng serve (4200) y la SPA servida por Nginx (8081)
  cors:
    allowed-origins: http://localhost:4200,http://localhost:8081

# SQL de Hibernate por el logger, para contar las consultas
logging:
  level:
    org.hibernate.SQL: DEBUG
  file:
    name: logs/pharma-backend.log   # tambien en archivo, para buscar por requestId
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
    file: "%d %-5level [%X{requestId}] %logger{36} - %msg%n"